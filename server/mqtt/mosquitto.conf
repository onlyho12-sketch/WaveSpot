# WaveSpot 현장 MQTT 브로커 (Eclipse Mosquitto)
# 시험장 내부망 전용 · 외부 인터넷 연결 없음
# 실행:  mosquitto -c server/mqtt/mosquitto.conf -v

listener 1883 0.0.0.0
# 해커톤 프로토타입: 수신기 전용 AP 안에서만 접속 가능하도록 네트워크로 격리
# 실제 운영 시 password_file 과 TLS(listener 8883) 사용
allow_anonymous true

persistence false
log_type error
log_type warning
log_type notice
