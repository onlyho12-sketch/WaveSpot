; WaveSpot 수신기 펌웨어 (ESP32) · PlatformIO 설정
; 빌드:  pio run -e receiver         (설치형 R1~R4)
;        pio run -e handheld         (휴대형 H1)
; 업로드: pio run -e receiver -t upload
[platformio]
src_dir = wavespot_receiver

[env]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    knolleary/PubSubClient@^2.8

[env:receiver]
build_flags = -DWS_ROLE_HANDHELD=0

[env:handheld]
build_flags = -DWS_ROLE_HANDHELD=1
